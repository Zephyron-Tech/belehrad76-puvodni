# Produkce na serveru webowky (/opt/belehrad76): aplikace + PostgreSQL + cron + zálohy.
# Před aplikací je nginx na hostiteli (HTTPS přes Let's Encrypt) – aplikace poslouchá jen na 127.0.0.1:3000.
# Image se sestavuje na serveru (scripts/deploy-webowky.sh). Proměnné: soubor .env vedle tohoto souboru
# (viz .env.example; DATABASE_URL se skládá níž z POSTGRES_PASSWORD).
services:
  app:
    # Na serveru jsou zdrojáky v ./src (APP_BUILD_CONTEXT=./src v .env), lokálně se staví z kořene repa
    build: ${APP_BUILD_CONTEXT:-.}
    image: belehrad76-app:latest
    container_name: belehrad-eshop
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eshop:${POSTGRES_PASSWORD}@db:5432/eshop
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 640m
    networks:
      - internal

  db:
    image: postgres:17-alpine
    container_name: belehrad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eshop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eshop
      TZ: Europe/Prague
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eshop -d eshop"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    networks:
      - internal

  # Každých 5 minut: zrušení nezaplacených objednávek po vypršení rezervace, upomínky, ověřovací e-maily
  cron:
    image: curlimages/curl:8.11.1
    container_name: belehrad-cron
    restart: unless-stopped
    env_file: .env
    depends_on:
      - app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 300
          curl -fsS -m 60 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/expire || echo "expire failed"
        done
    mem_limit: 32m
    networks:
      - internal

  # Záloha databáze každé 2 hodiny v sudou hodinu (0:00, 2:00, …), na serveru se drží 14 dní (./backups).
  # Každá záloha se zkontroluje (musí obsahovat tabulky objednávek a produktů). Nepovedená se nemaže,
  # jen přejmenuje na .chyba (pro kontrolu). Kopie mimo server: rychlik si je stahuje (scripts/backup-pull.sh).
  backup:
    image: postgres:17-alpine
    container_name: belehrad-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Prague
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%s)
          sleep $$(( 7200 - now % 7200 + 60 ))
          f=/backups/eshop-$$(date +%Y%m%d-%H%M).sql.gz
          if pg_dump -h db -U eshop eshop | gzip > "$$f.tmp"             && zcat "$$f.tmp" | grep -q 'COPY public."Order"'             && zcat "$$f.tmp" | grep -q 'COPY public."Product"'; then
            mv "$$f.tmp" "$$f" && echo "zaloha OK $$f $$(wc -c < "$$f") B"
          else
            mv "$$f.tmp" "$$f.chyba" 2>/dev/null; echo "CHYBA: zaloha selhala nebo je neuplna: $$f.chyba"
          fi
          find /backups -name 'eshop-*.sql.gz' -mtime +14 -delete
        done
    mem_limit: 64m
    networks:
      - internal

networks:
  internal:

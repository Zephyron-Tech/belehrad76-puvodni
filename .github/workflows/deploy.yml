name: Deploy

# Zatím jen ruční spuštění (Actions → Deploy → Run workflow).
# Až budou nastavené secrets, doména a GoPay, lze přidat automatické nasazení po push do main:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/zephyron-tech/footbaleshop
  # stejně jako beerCupon: domovská složka deploy uživatele
  PROJECT_DIR: /home/rychlik/footbaleshop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Ensure project directory exists on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ${{ env.PROJECT_DIR }}/data ${{ env.PROJECT_DIR }}/backups

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: ${{ env.PROJECT_DIR }}
          strip_components: 0

      - name: Write .env on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_URL: ${{ vars.APP_URL || 'https://belehrad76.cz' }}
          PRIMARY_HOST: ${{ vars.PRIMARY_HOST || 'belehrad76.cz' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GOPAY_MODE: ${{ vars.GOPAY_MODE || 'sandbox' }}
          GOPAY_GOID: ${{ secrets.GOPAY_GOID }}
          GOPAY_CLIENT_ID: ${{ secrets.GOPAY_CLIENT_ID }}
          GOPAY_CLIENT_SECRET: ${{ secrets.GOPAY_CLIENT_SECRET }}
          GOPAY_INSTRUMENTS: ${{ vars.GOPAY_INSTRUMENTS || 'PAYMENT_CARD,BANK_ACCOUNT,APPLE_PAY,GPAY' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          PACKETA_API_KEY: ${{ secrets.PACKETA_API_KEY }}
          PACKETA_API_PASSWORD: ${{ secrets.PACKETA_API_PASSWORD }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
          META_PIXEL_ID: ${{ vars.META_PIXEL_ID }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_URL,PRIMARY_HOST,POSTGRES_PASSWORD,GOPAY_MODE,GOPAY_GOID,GOPAY_CLIENT_ID,GOPAY_CLIENT_SECRET,GOPAY_INSTRUMENTS,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_SECURE,MAIL_FROM,CRON_SECRET,PACKETA_API_KEY,PACKETA_API_PASSWORD,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,GA4_MEASUREMENT_ID,META_PIXEL_ID,META_CAPI_TOKEN
          script: |
            set -e
            if [ -z "$POSTGRES_PASSWORD" ] || [ -z "$CRON_SECRET" ]; then echo "Chybí secrets POSTGRES_PASSWORD / CRON_SECRET"; exit 1; fi
            umask 077
            cat > "${{ env.PROJECT_DIR }}/.env" <<EOF
            APP_URL=$APP_URL
            PRIMARY_HOST=$PRIMARY_HOST
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            GOPAY_MODE=$GOPAY_MODE
            GOPAY_GOID=$GOPAY_GOID
            GOPAY_CLIENT_ID=$GOPAY_CLIENT_ID
            GOPAY_CLIENT_SECRET=$GOPAY_CLIENT_SECRET
            GOPAY_INSTRUMENTS=$GOPAY_INSTRUMENTS
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=${SMTP_PORT:-587}
            SMTP_USER=$SMTP_USER
            SMTP_PASSWORD=$SMTP_PASSWORD
            SMTP_SECURE=${SMTP_SECURE:-false}
            MAIL_FROM=$MAIL_FROM
            CRON_SECRET=$CRON_SECRET
            TURNSTILE_SITE_KEY=$TURNSTILE_SITE_KEY
            PACKETA_API_KEY=$PACKETA_API_KEY
            PACKETA_API_PASSWORD=$PACKETA_API_PASSWORD
            TURNSTILE_SECRET_KEY=$TURNSTILE_SECRET_KEY
            GA4_MEASUREMENT_ID=$GA4_MEASUREMENT_ID
            META_PIXEL_ID=$META_PIXEL_ID
            META_CAPI_TOKEN=$META_CAPI_TOKEN
            EOF
            chmod 600 "${{ env.PROJECT_DIR }}/.env"

      # Image je soukromý – přihlášení do GHCR tokenem tohoto běhu, do dočasného DOCKER_CONFIG.
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd ${{ env.PROJECT_DIR }}
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --force-recreate
